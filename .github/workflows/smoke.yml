name: Test bilingual robot states
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/bob-test" playwright@1.56.1
      - run: "$RUNNER_TEMP/bob-test/node_modules/.bin/playwright install --with-deps chromium"
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bob-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/bob-test/node_modules" node tests/browser.cjs

}
function show(s,line,detail='') {
 state=s; document.body.className=s;
 const states=['idle','processing','hype','malfunction','safety'];
 $('state').textContent=copy[lang].states[states.indexOf(s)]+(detail?' · '+detail:'');
 $('reply').textContent=line;
 for(const name of ['Idle','Processing','Hype','Malfunction'])
   $('screen'+name).classList.toggle('hidden',name.toLowerCase()!==(s==='safety'?'idle':s));
 $('screenProcessing').querySelector('text').textContent=lang==='en'?'THINKING…':'運算中…';
 $('submit').disabled=$('mode').disabled=$('message').disabled=$('mic').disabled=s==='processing';
}
function language(next) {
 turn++; silence(); listening?.abort(); lang=next;
 try{localStorage.setItem('ob3000_lang',lang)}catch{}
 const c=copy[lang]; document.documentElement.lang=lang;document.title=c.title+' · OB-3000';
 for(const id of ['title','sub','disclaimer','submit']) $(id).textContent=c[id];
 $('mute').textContent=muted?c.unmute:c.mute;
 $('mic').textContent=c.mic; $('messageLabel').textContent=c.label;$('message').placeholder=c.placeholder;
 $('modeLabel').textContent=c.mode;$('mode').replaceChildren(...modes.map((m,i)=>new Option(c.modes[i],m)));$('mode').value=mode;
 $('en').setAttribute('aria-pressed',lang==='en');$('zh').setAttribute('aria-pressed',lang==='zh-TW');
 show('idle',c.ready);
}
async function request(message,lang,hypeMode) {
 const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),4000);
 try{
 const res=await fetch('/ob3000Respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,lang,hypeMode}),signal:controller.signal});
 if(res.ok){const v=await res.json();if(['hype','malfunction','safety'].includes(v.state)&&typeof v.response==='string'&&v.response.trim()&&typeof v.processingLine==='string')return v;}
 }catch{}finally{clearTimeout(timer)}
 return fallback(message,lang,hypeMode);
}
$('form').onsubmit=async e=>{
 e.preventDefault(); const message=$('message').value.trim();
 if(!message||state==='processing')return;
 const id=++turn;listening?.abort();silence();
 if(crisis.test(message)){show('safety',copy[lang].safety);return}
 armAudio();show('processing',copy[lang].beat);thinking=setInterval(()=>tone(440+Math.random()*420),180);
 const [result]=await Promise.all([request(message,lang,mode),new Promise(resolve=>setTimeout(resolve,1100))]);
 if(id!==turn)return;
 clearInterval(thinking);
 if(result.state==='safety'){show('safety',copy[lang].safety);return}
 show(result.state,result.response,result.processingLine);
 if(result.state==='hype')[392,494,587,784].forEach((n,i)=>tone(n,i*.08));else tone(280,0,'sawtooth',60);
 speak(result.response);
};
$('mode').onchange=e=>{mode=e.target.value};
$('en').onclick=()=>language('en');$('zh').onclick=()=>language('zh-TW');
$('mute').onclick=()=>{muted=!muted;if(muted){silence();context?.suspend().catch(()=>{})}else armAudio();$('mute').textContent=muted?copy[lang].unmute:copy[lang].mute;};
$('mic').hidden=!Recognition;
$('mic').onclick=()=>{
 if(listening){listening.stop();return}
 const r=new Recognition();const locale=lang;r.lang=locale==='en'?'en-US':'zh-TW';listening=r;
 r.onresult=e=>{if(locale===lang&&state!=='processing')$('message').value=e.results[0][0].transcript.slice(0,280)};
 r.onend=r.onerror=()=>{if(listening===r){listening=null;$('mic').textContent=copy[lang].mic}};
 try{r.start();$('mic').textContent=copy[lang].stop}catch{r.onend()}
};
language(lang);
</script></body></html>
